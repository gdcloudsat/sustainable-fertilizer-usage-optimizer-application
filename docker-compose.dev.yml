version: '3.8'

# Development Docker Compose Configuration
# Use this for local development with hot reloading

services:
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: sfuo-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: sustainable_fertilizer
    volumes:
      - mongodb_data_dev:/data/db
    ports:
      - "27017:27017"
    networks:
      - sfuo-network-dev

  # Backend API (Development with hot reload)
  backend:
    image: node:20-alpine
    container_name: sfuo-backend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/sustainable_fertilizer?authSource=admin
      JWT_SECRET: dev_jwt_secret_key_not_for_production
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - sfuo-network-dev

volumes:
  mongodb_data_dev:
    driver: local

networks:
  sfuo-network-dev:
    driver: bridge
